name: AI Code Reviewer CI/CD

on:

  push:
    branches:
      - production

  pull_request:
    branches:
      - production

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Project
        run: mvn clean package -DskipTests

      - name: Build Docker Image
        run: docker build -t ai-code-reviewer .